# 시리즈 목록. parts는 계획한 부 제목(발행 전 「준비 중」으로 표시). 발행된 글은 머리말 series·part로 연결.
video-archive-ai:
  title: 개인 영상 아카이브와 AI
  desc: 꾸준히 찍어 쌓아둔 영상이 AI를 만나 어떻게 달라지는지
  parts:
    - 여행 영상 백업, AI에게 밤새 맡기고 아침에 검증 보고 받기
    - 카메라 다섯 대 촬영 시각 맞추고 프리미어 날짜별 시퀀스 만들기
    - "AI가 프리미어를 직접 만지게: 프리미어 MCP 연결기"
    - 62시간 여행 영상 자막 만들기와 AI 작업 효율
    - 언제 편집할지 몰라도 찍어둔 영상들의 앞날
    - 혼자 감당 못 하던 작업량, AI가 바꾼 아카이브의 가치
    - 저장장치의 가치는 더 올라간다
naver-blog-automation:
  title: 네이버 블로그 자동화와 콘텐츠 선점
  desc: 블로그 업로드를 자동화하고, 그 뒤에 든 생각
  parts:
    - 네이버 블로그 글쓰기, AI로 임시저장 직전까지 완전 자동화
    - 콘텐츠가 무한히 쏟아지기 전에, 아직 비어 있는 언어권을 선점해야겠다
    - 언어권 선점, 생각한 날 바로 다국어 사이트로 옮겼다
wedding-ai:
  title: 결혼 준비와 AI
  desc: 결혼식 영상과 결혼·신혼여행 준비를 AI로 처리한 기록
  parts:
    - 결혼식 식중 영상, 힉스필드로 2분 30초 만들고 업로드까지
    - 카톡 대화 통째로 내보내 신혼여행·결혼 체크리스트 웹으로 만들기
ai-orchestration:
  title: AI 오케스트레이션 만들기
  desc: 기기·계정·대화창이 달라도 같은 흐름으로 일하게 만드는 과정
  parts:
    - 클로드 대화창 바뀔 때마다 설명하기 지쳐서, GitHub에 AI의 뇌를 만들었다
    - 쿠팡 체험단은 하고 싶은데 밀린 리뷰만 수십 개.. 이렇게 해보세요!
